services:
  kidsmiss:
    image: ghcr.io/hieedaniel/kidsmiss:latest
    container_name: kidsmiss
    restart: unless-stopped
    ports:
      - "8770:8770"
    volumes:
      # 数据库 + 原图 + 配图 + 生成的卷子，全在这一个目录里
      - ./data:/app/server/data
    environment:
      TZ: Asia/Shanghai
      # 首次启动不要示例题：1 要，0 不要
      CUOTI_SEED: "0"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8770/api/meta', timeout=5).status == 200 else 1)
      interval: 30s
      timeout: 6s
      start_period: 20s
      retries: 3
